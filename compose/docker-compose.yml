# Production compose stack for a single Hermes client instance.
#
# Layout adapted from the official Nous compose (docker-compose.yml in
# NousResearch/hermes-agent), but with two changes for our use case:
#   - bridge network (not host) so Caddy can route by service name
#   - Caddy in front of the dashboard with basic_auth (the dashboard
#     exposes provider API keys; Nous's own warning is explicit)
#
# Required env (compose/.env on the VPS):
#   FQDN                          fully qualified domain (e.g. acme.example.com)
#   ACME_EMAIL                    contact email for Let's Encrypt
#   HERMES_IMAGE                  pinned hermes image (default below)
#   HERMES_DASHBOARD_USERNAME     operator/client login (basic_auth)
#   HERMES_DASHBOARD_PASSWORD_HASH bcrypt hash from `caddy hash-password`
#   OPENAI_API_KEY (or equivalent provider key)
#
# Optional:
#   HERMES_UID, HERMES_GID        match host volume ownership (default 10000)
#   HERMES_PROFILE                profile name to create on first boot (default: slug)

name: hermes-${COMPOSE_SLUG:-default}

networks:
  edge:
    name: hermes-edge
    driver: bridge
  internal:
    name: hermes-internal
    driver: bridge

volumes:
  caddy_data:
    name: hermes_caddy_data
  caddy_config:
    name: hermes_caddy_config
  # Single volume captures all Hermes state per the upstream design:
  # config.yaml, .env, profiles/, sessions/, logs/, cron/, memories/,
  # skills/, workspace/, auth.json. Backup this one path = backup everything.
  hermes_home:
    name: hermes_home

services:
  caddy:
    image: caddy:2-alpine
    container_name: hermes-caddy
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    environment:
      FQDN: ${FQDN:?FQDN must be set}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set}
      DASHBOARD_USERNAME: ${HERMES_DASHBOARD_USERNAME:?HERMES_DASHBOARD_USERNAME must be set}
      DASHBOARD_PASSWORD_HASH: ${HERMES_DASHBOARD_PASSWORD_HASH:?HERMES_DASHBOARD_PASSWORD_HASH must be set}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      hermes-dashboard:
        condition: service_started

  # --- hermes gateway: messaging integrations + background runtime ---
  # `gateway run` is the official foreground entrypoint for container use
  # (per `hermes gateway --help`: "recommended for WSL, Docker, Termux").
  # In M2 the gateway is started so the agent reacts to scheduled jobs and
  # any configured messaging platform; messaging credentials are opt-in.
  hermes-gateway:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:sha-d9b6f75c0b0ffa3cdb3cbe63de3a8e1a5aa44e8f}
    container_name: hermes-gateway
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      HERMES_HOME: /opt/data
      # The entrypoint sources /opt/data/.env at runtime; we also pass these
      # through compose so they're visible to `docker compose exec` debugging.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - hermes_home:/opt/data
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # --- hermes dashboard: web UI on :9119 ---
  # Bound to 0.0.0.0 so Caddy on the same docker network can reach it.
  # `--insecure` only disables the dashboard's own anti-LAN guard; Caddy
  # enforces basic_auth in front, so the surface is not actually exposed.
  # `--skip-build` avoids needing npm at runtime; UI assets are baked into
  # the image at build time (web/dist).
  hermes-dashboard:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:sha-d9b6f75c0b0ffa3cdb3cbe63de3a8e1a5aa44e8f}
    container_name: hermes-dashboard
    restart: unless-stopped
    command:
      - "dashboard"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "9119"
      - "--insecure"
      - "--no-open"
      - "--skip-build"
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      HERMES_HOME: /opt/data
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - hermes_home:/opt/data
    networks:
      - internal
    expose:
      - "9119"
    depends_on:
      hermes-gateway:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Dashboard answers HEAD / once initialised (~10-30s on first boot
      # because the .venv lazy-imports providers).
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:9119/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
